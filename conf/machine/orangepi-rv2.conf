#@TYPE: Machine
#@NAME: orangepi-rv2
#@SOC: Ky X1
#@DESCRIPTION: Machine configuration for OrangePi RV2

require conf/machine/include/x1-orangepi-common.inc

# Shared SoC-level override for Ky X1 OrangePi boards
MACHINEOVERRIDES .= ":x1-orangepi"

KERNEL_DEVICETREE ?= "ky/x1_orangepi-rv2.dtb"

IMAGE_BOOT_FILES += " \
	${UBOOT_ENV}.${UBOOT_ENV_SUFFIX} \
	x1_orangepi-rv2.dtb \
	${KERNEL_IMAGETYPE} \
	initramfs.img"

WKS_FILE ?= "orangepi-rv2.wks"

MACHINE_FEATURES = "screen keyboard ext2 ext3 serial"
