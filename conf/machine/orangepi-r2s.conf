#@TYPE: Machine
#@NAME: orangepi-r2s
#@SOC: Ky X1
#@DESCRIPTION: Machine configuration for OrangePi R2S

require conf/machine/include/x1-orangepi-common.inc

# Shared SoC-level override for Ky X1 OrangePi boards
MACHINEOVERRIDES .= ":x1-orangepi"

KERNEL_DEVICETREE ?= "ky/x1_orangepi-r2s.dtb"

IMAGE_BOOT_FILES += " \
	${UBOOT_ENV}.${UBOOT_ENV_SUFFIX} \
	x1_orangepi-r2s.dtb \
	${KERNEL_IMAGETYPE} \
	initramfs.img"

WKS_FILE ?= "orangepi-r2s.wks"

MACHINE_FEATURES = "keyboard ext2 ext3 serial"
